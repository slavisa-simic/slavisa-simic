name: Refresh profile

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile.yml'
      - 'config/profile.json'
      - 'config/tech-stack.json'
      - 'assets/profile/icons/**'
      - 'assets/source/fonts/**'
      - 'requirements.txt'
      - 'src/README.template.md'
      - 'scripts/profile_common.py'
      - 'scripts/refresh_profile.py'
      - 'scripts/profile_avatar.py'
      - 'scripts/tech_stack.py'
      - 'scripts/build_tech_carousel.py'
      - 'scripts/build_profile_assets.py'
      - 'scripts/verify_section_animation.mjs'
      - 'scripts/build_carousel.py'
      - 'scripts/build_project_table.py'
      - 'scripts/prepare_badges.py'
      - 'assets/profile/badges/**'
      - 'assets/profile/source/**'
      - 'tests/**'

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Install asset dependencies
        run: python -m pip install -r requirements.txt
      - name: Test profile refresh
        run: python -m unittest discover -s tests
      - name: Build project visuals
        run: python scripts/prepare_badges.py
      - name: Build project artwork
        run: python scripts/build_profile_assets.py
      - name: Build technology carousel
        run: python scripts/build_tech_carousel.py
      - name: Fetch public activity and current avatar
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/refresh_profile.py
      - name: Commit changed snapshot
        run: |
          git add README.md assets/profile/activity.json assets/profile/avatar.json assets/profile/generated assets/profile/icons assets/profile/badges
          if git diff --cached --quiet; then
            echo "Profile snapshot is unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public activity and profile avatar'
          git push origin HEAD:main
