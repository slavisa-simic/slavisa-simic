name: Refresh profile activity

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile.yml'
      - 'config/profile.json'
      - 'src/README.template.md'
      - 'scripts/profile_common.py'
      - 'scripts/refresh_profile.py'
      - 'tests/**'

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Test activity refresh
        run: python -m unittest discover -s tests
      - name: Fetch public project activity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/refresh_profile.py
      - name: Commit changed snapshot
        run: |
          git add README.md assets/profile/activity.json
          if git diff --cached --quiet; then
            echo "Project activity is unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public project activity'
          git push origin HEAD:main
